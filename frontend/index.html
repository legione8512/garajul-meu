<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` return real
         numbers. Without it those functions are zero even on a notched phone, so
         the padding written against them in index.css would silently do nothing
         and the header would go on being drawn underneath the clock. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- The served default is Romanian, and i18n/config.ts rewrites this
         attribute the moment the language is decided. Shipping `en` here made
         screen readers pronounce Romanian with an English voice. -->
    <title>Garajul Meu</title>
    <meta
      name="description"
      content="Organizează documentele mașinii tale și primește notificări înainte să expire ITP-ul, RCA-ul, rovinieta sau CASCO." />
    <meta
      name="theme-color"
      content="#100c1c"
/>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
