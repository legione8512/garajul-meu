# Activated with SPRING_PROFILES_ACTIVE=prod, which the Dockerfile sets as a
# default and Railway can override. Everything here overrides application.yml;
# anything absent here keeps the base value on purpose.
#
# No secret appears in this file and none ever may. The repository is public.
# Everything sensitive arrives from the environment, per section 33 - and this
# is the list, kept complete because a partial one is worse than none:
#
#   DB_URL, DB_MIGRATION_URL, DB_USERNAME, DB_PASSWORD
#   JWT_SECRET, PUSH_TOKEN_KEY
#   RESEND_API_KEY, SENTRY_DSN
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   GOOGLE_CREDENTIALS_JSON
#
# Two more are not secrets but are still set in Railway rather than here:
# PORT, which the platform assigns, and OCR_PROVIDER, which is the switch
# described in the ocr block below.

# Section 27: "human-readable development logs and structured production logs."
#
# ECS rather than plain JSON, because it is a published schema with agreed field
# names - a log line means the same thing to Railway's viewer, to Elastic and to
# anything else that reads it later, without a mapping nobody maintains.
#
# The request id survives the switch. It travels in the MDC, which the base file
# renders into a `[...]` prefix for a human reading a console; here that pattern
# is ignored and the MDC becomes structured fields instead. Same value, and
# still the thing that ties an error screen to a log line to a Sentry event.
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: garajul-meu-backend
        environment: production

server:
  # Railway assigns a port and routes to it. Hardcoding 8080 would mean the
  # health check reaches nothing and the deploy is rolled back with no clue why
  # - the application's own log would say it started perfectly. The default
  # keeps `docker run -p 8080:8080` working locally.
  port: ${PORT:8080}

  # Railway terminates TLS and forwards the request, so without this every
  # caller appears to arrive from the proxy's address.
  #
  # That is not cosmetic. `AuthRateLimit` keys the login and registration
  # budgets on `request.getRemoteAddr()`, and behind an unconfigured proxy every
  # visitor in the world shares one key - so the tenth failed login anywhere
  # locks out the eleventh person everywhere, and the per-address defence
  # becomes a global denial of service. `framework` installs Spring's
  # ForwardedHeaderFilter, which rewrites the request from X-Forwarded-For
  # before any filter of ours reads it.
  #
  # Trusting that header is only safe because the application is reachable
  # solely through Railway's proxy. If it ever gains a second, direct route,
  # this becomes a header any caller can forge to reset their own rate limit,
  # and the trust has to move to a known proxy list instead.
  forward-headers-strategy: framework

sentry:
  environment: production

garajul-meu:
  email:
    # Release blocker closed by 16.3. Startup now requires RESEND_API_KEY;
    # without it the application refuses to boot rather than accepting
    # registrations nobody can ever complete.
    provider: resend

  storage:
    # Release blocker closed by 16.4. A Railway container's filesystem is
    # discarded on every redeploy, so "local" here would lose every vehicle
    # photograph at each deploy - silently, with no error anywhere.
    provider: r2

  ocr:
    # Release blocker closed by 9.3 - but held behind an environment variable
    # rather than written here as "google", and the difference is a rollback
    # measured in seconds instead of a git revert, a rebuild and a redeploy.
    #
    # GoogleDocumentAiOcrProvider builds its client in the constructor, so a
    # wrong project, a missing IAM role or an unparseable key does not degrade
    # the scan - it stops the application from starting, exactly as a missing
    # EmailProvider did on the first deploy. A variable makes undoing that one
    # edit and a restart.
    #
    # Set OCR_PROVIDER=google in Railway once GOOGLE_CREDENTIALS_JSON is set.
    # StubOcrProvider announces itself on every boot until then, so the log says
    # which one is live rather than leaving it to be inferred.
    provider: ${OCR_PROVIDER:stub}

  cors:
  # Section 21's topology: sibling subdomains of one registrable domain, which
  # is what lets the SameSite=Strict refresh cookie travel at all.
  #
  # The second entry is the Android application, and it is an intention rather
  # than a development leftover. ProductionConfigurationTest used to fail the
  # build on the mere presence of "localhost" in this file; it now permits
  # exactly this one value and nothing else localhost-shaped, because a test
  # that bans a substring cannot tell a decision from a mistake.
  #
  # A Capacitor WebView serves the bundle from its own local server, so every
  # call to this API is cross-origin and arrives with Origin: https://localhost.
  # Without this entry the preflight is refused and the application is dead on
  # first launch, with the only evidence in a console nobody is watching.
  #
  # WHAT THIS DOES NOT OPEN, and the argument is the same SameSite fact the
  # native session model rests on. A page served from https://localhost in a
  # real browser may now call this API and read the answers - but it can
  # present nothing. The refresh cookie is SameSite=Strict, and localhost is a
  # different *site* from cyber-half.com, so a browser never attaches it. The
  # access token lives in a module variable inside the real application's
  # origin and is unreadable from anywhere else. What remains is calling
  # unauthenticated endpoints and reading the reply, which any HTTP client can
  # already do without a browser at all. Serving https://localhost on 443 with
  # a certificate the browser trusts requires local code execution first, and
  # anyone holding that has better attacks available.
  #
  # iOS arrives at phase 18 with capacitor://localhost, and that is a separate
  # question rather than a second line here: it is a non-http scheme, and
  # whether Spring's CorsConfiguration accepts one at all must be checked
  # rather than assumed.
    allowed-origins:
      - https://app.cyber-half.com
      - https://localhost

# ---------------------------------------------------------------------------
# NO RELEASE BLOCKER LEFT IN CONFIGURATION.
#
# What remains of section 9 is not a deployment step: 9.5's confidence
# thresholds are still the provisional 0.80 from application.yml, and section 35
# says they are calibrated against representative photographs rather than
# guessed. Two documents exist and neither is representative. Until then the
# scan proposes with a threshold nobody has measured, which is visible in the
# interface as a field marked for review rather than as a wrong value saved
# silently.
# ---------------------------------------------------------------------------