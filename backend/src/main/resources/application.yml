spring:
  application:
    name: backend

  # Local-only URLs and credentials. Gitignored, never committed.
  # "optional:" lets production start from environment variables instead.
  config:
    import: optional:file:./application-local.yml

  datasource:
    # Neon POOLED endpoint - hostname contains "-pooler".
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Neon scales to zero when idle: cold starts are slow, idle connections die.
      connection-timeout: 30000
      max-lifetime: 300000
      idle-timeout: 60000
      minimum-idle: 0
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate may only verify, never alter.
      ddl-auto: validate

  flyway:
    # Neon DIRECT endpoint - no "-pooler". Flyway needs a session-level lock.
    url: ${DB_MIGRATION_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      # Just above our own limit, so the container refuses the absurd uploads
       # before buffering them and our validator handles the merely too large.
      max-file-size: 12MB
      max-request-size: 13MB

logging:
  level:
    "[org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver]": error
  pattern:
    correlation: "[%X{requestId:-system}] "

# Section 27: "Railway logs/metrics + Spring Boot Actuator health endpoint".
# Health, and nothing else, ever.
management:
  endpoints:
    web:
      exposure:
        # This is already the default, and it is written down because of what
        # sits underneath it. SecurityConfig permits /actuator/health without a
        # token and then falls through to `anyRequest().authenticated()` - so a
        # second exposed endpoint would not be protected by an admin rule, it
        # would be readable by **every person who has registered an account**.
        # There is no authorization rule on this chain to stop them; there has
        # never needed to be one, because only health has ever been exposed.
        #
        # ProductionConfigurationTest fails the build if this list ever grows or
        # gains a wildcard. Growing it safely means adding an authorization rule
        # first, which is a different piece of work and would finally trigger
        # the AccessDeniedHandler that section 17 has been waiting for.
        include: health
  endpoint:
    health:
      # The endpoint is public, so its answer must be a single word. Details
      # name the database vendor, the host and the validation query; components
      # name every health indicator registered. Neither is anybody's business
      # from outside, and both are free reconnaissance.
      show-details: never
      show-components: never

# Section 27: unexpected exceptions only. Section 24: PII scrubbing configured
# at first integration, not postponed.
sentry:
  # Empty locally and absent in tests, which disables the SDK entirely - the
  # repository is public and a DSN belongs in the environment beside JWT_SECRET.
  # src/test/resources/application.yml shadows this file, so no test ever sees
  # even this much.
  dsn: ${SENTRY_DSN:}

  # Separates a laptop's noise from production's. The prod profile sets this to
  # "production"; nothing sets it locally, so anything that does arrive from a
  # developer machine is labelled as such rather than mixed in.
  environment: ${SENTRY_ENVIRONMENT:local}

  # Section 24. The default is already false, and it is written here anyway,
  # because a privacy setting that is merely defaulted looks exactly like one
  # that was considered - and this project has been bitten by that once already,
  # with a `strict` flag that was never switched on and never noticed.
  send-default-pii: false

  # No request body on an event. Bodies here carry passwords, verification codes
  # and certificate fields; section 27 forbids every one of them reaching a log,
  # and an exception report is a log with a nicer interface.
  max-request-body-size: none

  # Tracing off. Section 27 asks for error reporting and says nothing about
  # performance; spans would add a second surface where URLs and parameters
  # could travel, for a question nobody has asked yet. Raise it when there is a
  # latency problem worth measuring.
  traces-sample-rate: 0

  # The one setting that would otherwise defeat the whole arrangement.
  #
  # Sentry installs a HandlerExceptionResolver whose default order is
  # Integer.MIN_VALUE, so it runs BEFORE @ExceptionHandler and captures every
  # exception - including every ApiException, which is to say every wrong
  # password, every failed validation, every 404. That is precisely what section
  # 27 forbids: "expected 4xx business errors are not treated as crashes".
  #
  # Moved to last, it never fires at all: GlobalExceptionHandler declares
  # @ExceptionHandler(Exception.class), so the resolver chain always stops
  # before reaching it. Reporting is left entirely to the Logback appender,
  # which sees exactly what was logged at ERROR - and by design that is only
  # ever the unhandled case.
  exception-resolver-order: 2147483647

garajul-meu:
  auth:
    verification-code-validity: 15m
    max-verification-attempts: 5
    refresh-token-validity: 30d
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity: 10m
    issuer: garajul-meu
  email:
  # Production must override this with "resend".
    provider: logging
  # Absent in development, where the logging provider needs neither. An unset
  # variable arrives here as an empty string, which ResendEmailProvider treats
  # as missing and refuses to start on - loudly, at boot, naming the property.
    api-key: ${RESEND_API_KEY:}
  # Section 21 puts sending on its own subdomain: a code marked as spam then
  # damages the reputation of mail nobody reads, rather than of the address a
  # person actually writes to. Resend verifies this domain by DNS.
    from: "${EMAIL_FROM:Garajul Meu <noreply@mail.cyber-half.com>}"
  push:
  # The only provider that exists. Section 18 makes push native-only and the
  # applications are phases 17 and 18; production overrides this with
  # "firebase" when there is something to deliver to.
    provider: logging
  # Section 10.7: the token is kept retrievable and encrypted, not hashed.
  # No default, exactly like jwt.secret - a missing key must be a refusal to
  # start, never a silently weak one. Local development reads it from
  # application-local.yml, which is gitignored.
    token-key: ${PUSH_TOKEN_KEY}
  storage:
    # Section 32's seam, named there as FileStorageProvider →
    # CloudflareR2FileStorageProvider. "local" writes to the filesystem for
    # development; production sets "r2". The local directory is gitignored - it
    # holds photographs of real cars.
    provider: local
    local-directory: ./storage
    max-upload-bytes: 5242880
    min-side: 200
    max-pixels: 40000000
    # Empty in development, where the local provider reads none of it. An unset
    # variable arrives as an empty string, which the R2 provider treats as
    # missing and refuses to start on - loudly, at boot, naming the property.
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
  reminder:
  # Section 19: exactly one instance runs this. Scaling the backend horizontally
  # means turning it off everywhere but one, or designing the distributed lock
  # that section defers - never simply raising the replica count.
    scheduler-enabled: true
    poll-interval-seconds: 60
    batch-size: 50
    max-attempts: 3
    stale-after-minutes: 10
  cors:
    # Exact origins, never a wildcard: a wildcard cannot be combined with
    # credentials, and every request this API answers carries them.
    # The prod profile replaces this with the real application origin.
    allowed-origins:
      - http://localhost:5173
  rate-limit:
    # Grouped by what a request costs, not by endpoint.
    credential-check:
      limit: 10
      window: 15m
    email-dispatch:
      limit: 5
      window: 1h
    token-refresh:
      limit: 60
      window: 1h
  ocr:
  # Section 13's initial defaults. Production may raise or lower them; the
  # allowance is metered in the database, not in memory, because each request
  # costs money at the provider.
    daily-limit: 10
    monthly-limit: 30
  # Section 32's seam. "stub" answers with a canned document; "google" calls
  # Document AI and arrives in 9.3.
    provider: stub
    max-upload-bytes: 10485760
    min-side: 200
    max-pixels: 40000000
  # Provisional. Section 35 calibrates this against representative samples,
  # which do not exist yet - so it is a placeholder that says so.
    confidence-threshold: 0.80
  # Identifiers, not secrets: they name a processor, they do not open it. The
  # credentials come from the environment - locally from
  # `gcloud auth application-default login`, in production from a service
  # account - and never from this file.
    google:
      project-id: garajul-meu-505722
      location: eu
      processor-id: 7f0ef1c4beff0c0f