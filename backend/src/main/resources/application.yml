spring:
  application:
    name: backend

  # Local-only URLs and credentials. Gitignored, never committed.
  # "optional:" lets production start from environment variables instead.
  config:
    import: optional:file:./application-local.yml

  datasource:
    # Neon POOLED endpoint - hostname contains "-pooler".
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Neon scales to zero when idle: cold starts are slow, idle connections die.
      connection-timeout: 30000
      max-lifetime: 300000
      idle-timeout: 60000
      minimum-idle: 0
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate may only verify, never alter.
      ddl-auto: validate

  flyway:
    # Neon DIRECT endpoint - no "-pooler". Flyway needs a session-level lock.
    url: ${DB_MIGRATION_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      # Just above our own limit, so the container refuses the absurd uploads
       # before buffering them and our validator handles the merely too large.
      max-file-size: 12MB
      max-request-size: 13MB

logging:
  level:
    "[org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver]": error
  pattern:
    correlation: "[%X{requestId:-system}] "

garajul-meu:
  auth:
    verification-code-validity: 15m
    max-verification-attempts: 5
    refresh-token-validity: 30d
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity: 10m
    issuer: garajul-meu
  email:
    # Production must override this with "resend".
    provider: logging
  cors:
    # Exact origins, never a wildcard: a wildcard cannot be combined with
    # credentials, and every request this API answers carries them.
    # Production overrides this with the real application origin.
    allowed-origins:
      - http://localhost:5173
  rate-limit:
    # Grouped by what a request costs, not by endpoint.
    credential-check:
      limit: 10
      window: 15m
    email-dispatch:
      limit: 5
      window: 1h
    token-refresh:
      limit: 60
      window: 1h
  ocr:
  # Section 13's initial defaults. Production may raise or lower them; the
  # allowance is metered in the database, not in memory, because each request
  # costs money at the provider.
    daily-limit: 10
    monthly-limit: 30
  # Section 32's seam. "stub" answers with a canned document; "google" calls
  # Document AI and arrives in 9.3.
    provider: stub
    max-upload-bytes: 10485760
    min-side: 200
    max-pixels: 40000000
  # Provisional. Section 35 calibrates this against representative samples,
  # which do not exist yet - so it is a placeholder that says so.
    confidence-threshold: 0.80
  # Identifiers, not secrets: they name a processor, they do not open it. The
  # credentials come from the environment - locally from
  # `gcloud auth application-default login`, in production from a service
  # account - and never from this file.
    google:
      project-id: garajul-meu-505722
      location: eu
      processor-id: 7f0ef1c4beff0c0f