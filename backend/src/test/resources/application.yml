# Test-only configuration.
#
# This file deliberately shadows src/main/resources/application.yml, because
# target/test-classes precedes target/classes on the test classpath. The effect
# is that no test can ever read the Neon URLs from backend/application-local.yml.
# Specification section 20 forbids running automated tests against the Neon
# development branch.
#
# The datasource comes from the Testcontainers @ServiceConnection bean, and
# Flyway reuses it because no spring.flyway.url is set here.

spring:
  application:
    name: backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# Because this file shadows the main one, every @ConditionalOnProperty seam has
# to be repeated here or its bean simply does not exist in tests. @DefaultValue
# on the properties record does not help: it applies when the record is bound,
# while the condition reads the raw environment, so an absent property means an
# absent bean however the default is written. The timings in AuthProperties are
# a different matter - they have @DefaultValue defaults, nothing conditions on
# them, and repeating them would create two copies that quietly drift apart.
garajul-meu:
  email:
    provider: logging
  push:
    provider: logging
  storage:
    provider: local
    # Under target/, so a stray write lands where `mvn clean` will remove it
    # rather than in the working tree. Nothing should write here at all - the
    # provider creates its directory on first use and no test uses the bean -
    # but "should" is not a guarantee, and this is one line.
    local-directory: ./target/storage
    # Sixty-four kilobytes: far above the few-kilobyte test images and far below
    # anything real, so the bound can be tested by sending seventy kilobytes
    # instead of five and a bit megabytes.
    max-upload-bytes: 65536
  ocr:
    provider: stub
  jwt:
    secret: "test-only-signing-key-never-used-outside-tests"

  # The one seam here whose absent state is the safe one, and it still has to be
  # written down. With scheduling enabled, every Spring test in the project would
  # dispatch real reminders against its own container while it ran - so this is
  # off, and ReminderDispatcherFlowTest calls runOnce() itself instead.
  #
  # The interval is repeated because @Scheduled resolves its placeholder from the
  # environment like the conditions do, and this file shadows the one that has it.
  reminder:
    scheduler-enabled: false
    poll-interval-seconds: 60

    # Needed because CorsTest asserts on a configured origin. Kept here rather
    # than in a @TestPropertySource on that class: per-test properties change the
    # Spring context cache key, which would start a fifth PostgreSQL container.
  cors:
    allowed-origins:
      - http://localhost:5173

  # Deliberately far above anything a test does. The limiter is a singleton and
  # its counters are not transactional, so they survive between test methods: a
  # realistic limit here would make unrelated tests fail depending on the order
  # they happen to run in. AuthFlowTest alone logs in eleven times, which is
  # exactly how this was discovered. AuthRateLimitTest overrides these with
  # real-looking numbers inside its own Spring context, which is the only place
  # the limits are the thing under test.
  rate-limit:
    credential-check:
      limit: 10000
      window: 15m
    email-dispatch:
      limit: 10000
      window: 1h
    token-refresh:
      limit: 10000
      window: 1h